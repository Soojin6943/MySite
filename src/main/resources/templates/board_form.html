<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="stylesheet" type="text/css" th:href="@{/bootstrap.min.css}">

  <title>게시물 등록</title>
</head>
<body>
  <div class="container">
    <h5 class="my-3 border-bottom pb-2">게시물 등록</h5>
    <form th:action="@{/board/create}" th:object="${boardForm}" method="post">
      <div class="alert alert-danger" role="alert" th:if="${#fields.hasAnyErrors()}">
        <div th:each="err : ${#fields.allErrors()}" th:text="${err}"></div>
      </div>
      <div class="mb-3">
        <label for="subject" class="form-label">제목</label>
        <input type="text" th:field="*{subject}" id="subject" class="form-control">
      </div>
      <div class="mb-3">
        <label for="content" class="form-label">내용</label>
        <textarea th:field="*{content}" id="content" class="form-control" rows="10"></textarea>
      </div>
      <input type="submit" value="저장하기" class="btn btn-primary my-2">
    </form>
  </div>

</body>
</html>
